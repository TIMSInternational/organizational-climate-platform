AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  App Runner service for climate-project-api. ONE template for every
  environment (#156): everything environment-specific -- service name, tags,
  ASPNETCORE_ENVIRONMENT, CORS origins, secret ARNs, image -- is a parameter,
  and the defaults are production's values, so deploying with defaults renders
  exactly the stack that was live before the parameterisation. The "prod" in
  this FILE's name is kept for continuity with the runbooks and workflows that
  cite it; the staging stack deploys from this same file with staging values
  (.github/workflows/deploy-staging.yml, docs/runbooks/staging-provisioning.md).

Parameters:
  ServiceName:
    Type: String
    Default: climate-project-api-prod
    AllowedPattern: "[A-Za-z0-9][A-Za-z0-9-_]{3,39}"
    Description: App Runner service name.
  EnvironmentName:
    Type: String
    Default: production
    AllowedValues:
      - production
      - staging
    Description: >-
      Lowercase environment name, used for the Environment resource tags. This
      and AspNetCoreEnvironment travel together (production/Production,
      staging/Staging); they are two parameters rather than one because
      CloudFormation cannot change a string's case without a Mappings lookup,
      and scripts/verify-prod-deploy-invariants.py resolves plain !Ref only.
      Both deploy workflows pass both explicitly.
  AspNetCoreEnvironment:
    Type: String
    Default: Production
    AllowedValues:
      - Production
      - Staging
    Description: >-
      Value for ASPNETCORE_ENVIRONMENT. Pascal case where EnvironmentName is
      lowercase, because that is ASP.NET Core's convention for the value while
      the resource tags have always been lowercase. The app keys no behaviour
      on it -- there is no appsettings.Staging.json and no IsProduction()
      branch (checked 2026-08-15) -- but /version and the system-status
      endpoint report it, so an honest value is what makes a staging instance
      identify itself as staging rather than masquerade as production.
  ImageIdentifier:
    Type: String
    Description: Full ECR image identifier, including tag.
  EcrAccessRoleArn:
    Type: String
    Description: IAM role ARN that App Runner uses to pull the private ECR image.
  HealthCheckPath:
    Type: String
    Default: /ready
    Description: >-
      App Runner HTTP health check path. /ready, NOT /health (#221): /health is a static
      literal that opens no database connection, so an instance that has lost Postgres
      passes it forever and is never replaced. See HealthCheckConfiguration below for the
      thresholds this path's latency profile requires.
  Cpu:
    Type: String
    Default: 0.25 vCPU
    AllowedValues:
      - 0.25 vCPU
      - 0.5 vCPU
      - 1 vCPU
      - 2 vCPU
      - 4 vCPU
    Description: App Runner CPU allocation.
  Memory:
    Type: String
    Default: 0.5 GB
    AllowedValues:
      - 0.5 GB
      - 1 GB
      - 2 GB
      - 3 GB
      - 4 GB
      - 6 GB
      - 8 GB
      - 10 GB
      - 12 GB
    Description: App Runner memory allocation.
  CorsAllowedOrigin:
    Type: String
    Description: Exact production frontend origin allowed by CORS.
  CorsAllowedWildcardOrigin:
    Type: String
    Description: Wildcard-pattern frontend origin allowed by CORS (Vercel preview deployments).
  CorsAdditionalAllowedOrigin:
    Type: String
    Default: ""
    Description: >-
      Optional SECOND exact frontend origin (#160). The application binds
      Cors:AllowedOrigins as a string array and has always accepted any number of entries;
      until now this template wired index 0 only, so adding the customer-facing domain meant
      DISPLACING the vercel.app origin rather than joining it. Leave empty to wire index 0
      alone -- an empty string here removes the index-1 variable entirely rather than
      binding "" as an origin (see the Conditions below for why that matters).
  CorsAdditionalAllowedWildcardOrigin:
    Type: String
    Default: ""
    Description: >-
      Optional SECOND wildcard-pattern frontend origin (#160), e.g. a staging preview
      domain alongside the Vercel one. Same empty-means-absent rule as
      CorsAdditionalAllowedOrigin, and here it is load-bearing: CorsOriginMatcher throws on a
      wildcard pattern containing no '*', and that throw happens while the CORS middleware is
      built during host start -- so binding "" at index 1 would stop production booting.
  TrackingJwtSecretArn:
    Type: String
    Description: Secrets Manager ARN holding the TrackingJwtSecret value (JWT signing key shared with climate-tracking).
  DatabaseConnectionStringSecretArn:
    Type: String
    Description: Secrets Manager ARN holding the Supabase Postgres connection string.
  EmailSmtpUsernameSecretArn:
    Type: String
    Description: >-
      Secrets Manager ARN holding the SES SMTP username (the IAM access key id of the
      climate-project-smtp user). Paired with EmailSmtpPasswordSecretArn -- BOTH must be set
      or neither: EmailOptions.ValidationError() refuses to start the host once
      Email__Provider is 'smtp' and a required setting is missing, so a half-configuration
      fails at boot rather than silently recording every notification as failed.
  EmailSmtpPasswordSecretArn:
    Type: String
    Description: >-
      Secrets Manager ARN holding the SES SMTP password. This is NOT the IAM secret access
      key: it is that key run through the SigV4 derivation SES requires (region us-east-1,
      service 'ses', terminal 'aws4_request', message 'SendRawEmail', 0x04 version prefix).
      Regenerating the access key invalidates it, so rotate both secrets together.
  InternalApiKeySecretArn:
    Type: String
    Description: >-
      Secrets Manager ARN holding the InternalApiKey value (shared static secret that
      authenticates climate-tracking's calls to /api/internal/*). REQUIRED: as of #189 the
      host validates this at startup (ValidateOnStart), so if it is unset the service does
      not boot at all, fails its App Runner health check, and the deploy fails outright.
      It no longer degrades to per-request 500s on /api/internal/* the way it did before
      #189 -- the failure is now earlier and total.

Conditions:
  # An optional list element cannot be expressed by passing an empty value: the app binds
  # Cors:AllowedOrigins / Cors:AllowedWildcardOrigins straight from the numbered environment
  # variables, so Cors__AllowedOrigins__1="" binds a literal empty-string origin, and
  # Cors__AllowedWildcardOrigins__1="" fails the host at startup outright. These conditions
  # drive an Fn::If that resolves to AWS::NoValue, which drops the whole list ENTRY -- the
  # only way to make an index genuinely absent rather than present-and-empty.
  HasAdditionalAllowedOrigin: !Not [!Equals [!Ref CorsAdditionalAllowedOrigin, ""]]
  HasAdditionalAllowedWildcardOrigin: !Not [!Equals [!Ref CorsAdditionalAllowedWildcardOrigin, ""]]

Resources:
  AppRunnerInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ServiceName}-instance
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: tasks.apprunner.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: read-runtime-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref TrackingJwtSecretArn
                  - !Ref DatabaseConnectionStringSecretArn
                  - !Ref InternalApiKeySecretArn
                  - !Ref EmailSmtpUsernameSecretArn
                  - !Ref EmailSmtpPasswordSecretArn
      Tags:
        - Key: Project
          Value: climate-project-api
        - Key: Environment
          Value: !Ref EnvironmentName

  AppRunnerService:
    Type: AWS::AppRunner::Service
    Properties:
      ServiceName: !Ref ServiceName
      SourceConfiguration:
        AuthenticationConfiguration:
          AccessRoleArn: !Ref EcrAccessRoleArn
        AutoDeploymentsEnabled: false
        ImageRepository:
          ImageIdentifier: !Ref ImageIdentifier
          ImageRepositoryType: ECR
          ImageConfiguration:
            Port: "8080"
            RuntimeEnvironmentVariables:
              - Name: ASPNETCORE_ENVIRONMENT
                Value: !Ref AspNetCoreEnvironment
              - Name: ASPNETCORE_URLS
                Value: http://+:8080
              - Name: Cors__AllowedOrigins__0
                Value: !Ref CorsAllowedOrigin
              - !If
                - HasAdditionalAllowedOrigin
                - Name: Cors__AllowedOrigins__1
                  Value: !Ref CorsAdditionalAllowedOrigin
                - !Ref AWS::NoValue
              - Name: Cors__AllowedWildcardOrigins__0
                Value: !Ref CorsAllowedWildcardOrigin
              - !If
                - HasAdditionalAllowedWildcardOrigin
                - Name: Cors__AllowedWildcardOrigins__1
                  Value: !Ref CorsAdditionalAllowedWildcardOrigin
                - !Ref AWS::NoValue
              # THE #220 RATCHET. "true" makes the API refuse to start when its connection
              # string points at Supabase's transaction pooler (port 6543), which is the
              # configuration that caused #220: Supavisor transaction mode hands a different
              # backend to each statement, and Npgsql holds pooled connections open across
              # statements, so roughly half of all /ready probes hung for 30 seconds.
              #
              # Ordered sequence (also in infra/aws/README.md, "Arming the guard"):
              #   1. DONE 2026-08-10 -- climate-project-api/prod/database-connection-string
              #      moved 6543 -> 5432 (secret version f22f6c08, AWSCURRENT).
              #   2. DONE 2026-08-10 -- redeployed; 20 of 20 consecutive /ready probes
              #      returned 200 and the "TRANSACTION pooler" warning is gone from the App
              #      Runner logs. #220 closed 2026-08-11 on that evidence.
              #   3. DONE 2026-08-17 -- armed, in its own commit and its own rollout, as
              #      step 2's change specified. From here a runtime string regressing to
              #      6543 fails the deploy at startup validation instead of degrading
              #      /ready by half at 3am: the throw is inside ValidateOnStart, the App
              #      Runner health check probes /ready (#221), so the rollout is rejected
              #      and the previous version keeps serving. Fail closed, on purpose.
              - Name: Database__RequireSessionPooler
                Value: "true"
              # RATE LIMITING BEHIND THE APP RUNNER PROXY (#146).
              #
              # App Runner terminates the client connection at an AWS-managed proxy and opens
              # its own connection to this container, so HttpContext.Connection.RemoteIpAddress
              # is that proxy, not the caller. Every per-address rate limit in the app would
              # therefore share ONE bucket across the whole internet -- the first thirty
              # microclimate responses in a minute would 429 everyone else, which is a worse
              # outage than having no limit.
              #
              # "1" means "one trusted proxy appends to X-Forwarded-For, so the caller is the
              # LAST entry of that header" (ClientIpResolver.TrustedProxyHopCount; the
              # semantics match ForwardedHeadersOptions.ForwardLimit). It is safe here and
              # only here because the container is not reachable except through that proxy: a
              # caller cannot pre-seed the entry App Runner appends. Do NOT copy this value to
              # a deployment where the app is addressable directly.
              #
              # The value follows from App Runner's documented X-Forwarded-For behaviour and
              # has not been observed against a running service, because nothing in this
              # repository can. "0" restores the pre-#146 behaviour exactly and is the correct
              # thing to fall back to if it turns out to be wrong; do not guess it upward.
              - Name: RateLimiting__TrustedProxyHopCount
                Value: "1"
              # HSTS is emitted explicitly rather than by app.UseHsts(), because behind the
              # proxy above Request.IsHttps is false and UseHsts() would emit nothing at all
              # here. See SecurityOptions.EnableHsts. The public App Runner endpoint is
              # HTTPS-only, so the header is accurate.
              - Name: Security__EnableHsts
                Value: "true"
              # Mail (#100). Until this block existed the service ran with Email:Provider
              # defaulting to 'none', so EVERY email notification was recorded as failed --
              # not because SES refused it, but because the app was never told SES exists.
              # SES itself was already production-enabled and timsint.com already verified
              # with DKIM; only this wiring was missing.
              - Name: Email__Provider
                Value: "smtp"
              - Name: Email__SmtpHost
                Value: "email-smtp.us-east-1.amazonaws.com"
              - Name: Email__SmtpPort
                Value: "587"
              - Name: Email__SmtpUseStartTls
                Value: "true"
              - Name: Email__FromAddress
                Value: "no-reply@timsint.com"
              - Name: Email__FromName
                Value: "TIMS Clima Organizacional"
              # Every link in outbound mail is built from this, including the
              # /survey-invitations/{token} address that starts the whole respond loop. It is
              # the web origin, NOT the App Runner hostname: a recipient opens it in a browser.
              - Name: Email__AppBaseUrl
                Value: "https://climate.timsint.com"
              # SES configuration set. The AWS account behind this SMTP endpoint is shared
              # with tims-marketing, formmaps, pca, alto and tims-suite, and SES scores bounce
              # and complaint rate against the ACCOUNT -- so without this header a bounce
              # caused here degrades a reputation none of those products can attribute or
              # defend, and a bad enough day pauses sending for all six. Naming the set makes
              # this product's sends separately measurable and is what SES publishes
              # bounce/complaint events through. The set 'tims-transactional' already exists on
              # the account; this only tells the app to stamp it on outbound mail. Optional in
              # EmailOptions -- blank emits no header at all, which is what local MailHog and
              # CI need -- so removing this line degrades to today's behaviour rather than
              # breaking the boot.
              - Name: Email__SesConfigurationSet
                Value: "tims-transactional"
            RuntimeEnvironmentSecrets:
              - Name: TrackingJwtSecret
                Value: !Ref TrackingJwtSecretArn
              - Name: ConnectionStrings__ClimateProject
                Value: !Ref DatabaseConnectionStringSecretArn
              - Name: InternalApiKey
                Value: !Ref InternalApiKeySecretArn
              - Name: Email__SmtpUsername
                Value: !Ref EmailSmtpUsernameSecretArn
              - Name: Email__SmtpPassword
                Value: !Ref EmailSmtpPasswordSecretArn
      InstanceConfiguration:
        Cpu: !Ref Cpu
        Memory: !Ref Memory
        InstanceRoleArn: !GetAtt AppRunnerInstanceRole.Arn
      # Tuned for a probe that ROUND-TRIPS POSTGRES, which /health never did (#221). Every
      # number below is a consequence of that one change; App Runner allows 1-20 for all four.
      #
      # The thing to hold on to when changing any of them: replacing an instance does not fix
      # a database outage. A fresh instance fails the same probe, so thresholds tight enough
      # to react to a blip convert a slow database into a replacement loop -- which is exactly
      # the objection that kept this pointed at /health, and the reason the window below is
      # deliberately long rather than merely non-zero.
      #
      # Timeout 5 -- the healthy path measured a 0.37s median on the live service (#220, after
      #   the session-pooler fix), so 5s is ~13x the real latency and cannot fire in steady
      #   state. The failure it must catch is unbounded, not slow: #220's signature was a
      #   30-second read hang on a socket the pooler had rebalanced away, so a tighter timeout
      #   strictly improves detection and a looser one only delays it. The one expected miss
      #   is the first probe against a cold instance, measured at 9.4s post-deploy while the
      #   EF model builds and the first pooled connection opens; UnhealthyThreshold absorbs it
      #   four times over, and at Interval 20 the second probe lands long after warm-up.
      # Interval 20 (the maximum) -- each probe is now a real `SELECT 1` from every instance.
      #   At the default autoscaling MaxSize of 25 that is 1.25 queries/second of pure
      #   health-check traffic against the connection budget documented in infra/aws/README.md;
      #   10 would double it. It also doubles the outage window below, which is the larger win.
      # UnhealthyThreshold 5 -- with Interval 20 an instance survives ~100s of CONTINUOUS
      #   failure before replacement. Long enough that a Supavisor failover does not start a
      #   churn, short enough that a genuinely broken instance is replaced within two minutes.
      # HealthyThreshold 3 (was 1) -- #220's defect was ~50% intermittent, and at 1 a coin-flip
      #   instance is declared healthy on its first lucky 200. That is the same "one green
      #   probe proves nothing" error the deploy canary had (#300). It cannot be 20 like the
      #   canary, because HealthyThreshold x Interval is added to EVERY rollout: 3 costs 60s,
      #   20 would cost 400s.
      HealthCheckConfiguration:
        Protocol: HTTP
        Path: !Ref HealthCheckPath
        Interval: 20
        Timeout: 5
        HealthyThreshold: 3
        UnhealthyThreshold: 5
      NetworkConfiguration:
        IngressConfiguration:
          IsPubliclyAccessible: true
        EgressConfiguration:
          EgressType: DEFAULT
        IpAddressType: IPV4
      Tags:
        - Key: Project
          Value: climate-project-api
        - Key: Environment
          Value: !Ref EnvironmentName

Outputs:
  ServiceArn:
    Description: App Runner service ARN.
    Value: !GetAtt AppRunnerService.ServiceArn
  ServiceId:
    Description: App Runner service ID.
    Value: !GetAtt AppRunnerService.ServiceId
  ServiceUrl:
    Description: App Runner generated service URL, without protocol.
    Value: !GetAtt AppRunnerService.ServiceUrl
  InstanceRoleArn:
    Description: Runtime instance role ARN.
    Value: !GetAtt AppRunnerInstanceRole.Arn
