AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  App Runner service for climate-project-api, deployed dark: it serves the
  health/version walking skeleton only. No real traffic or domain logic
  depends on it yet — this proves the deploy pipeline before #48-56 land.

Parameters:
  ServiceName:
    Type: String
    Default: climate-project-api-prod
    AllowedPattern: "[A-Za-z0-9][A-Za-z0-9-_]{3,39}"
    Description: App Runner service name.
  ImageIdentifier:
    Type: String
    Description: Full ECR image identifier, including tag.
  EcrAccessRoleArn:
    Type: String
    Description: IAM role ARN that App Runner uses to pull the private ECR image.
  HealthCheckPath:
    Type: String
    Default: /health
    Description: App Runner HTTP health check path.
  Cpu:
    Type: String
    Default: 0.25 vCPU
    AllowedValues:
      - 0.25 vCPU
      - 0.5 vCPU
      - 1 vCPU
      - 2 vCPU
      - 4 vCPU
    Description: App Runner CPU allocation.
  Memory:
    Type: String
    Default: 0.5 GB
    AllowedValues:
      - 0.5 GB
      - 1 GB
      - 2 GB
      - 3 GB
      - 4 GB
      - 6 GB
      - 8 GB
      - 10 GB
      - 12 GB
    Description: App Runner memory allocation.
  CorsAllowedOrigin:
    Type: String
    Description: Exact production frontend origin allowed by CORS.
  CorsAllowedWildcardOrigin:
    Type: String
    Description: Wildcard-pattern frontend origin allowed by CORS (Vercel preview deployments).
  TrackingJwtSecretArn:
    Type: String
    Description: Secrets Manager ARN holding the TrackingJwtSecret value (JWT signing key shared with climate-tracking).
  DatabaseConnectionStringSecretArn:
    Type: String
    Description: Secrets Manager ARN holding the Supabase Postgres connection string.
  InternalApiKeySecretArn:
    Type: String
    Description: >-
      Secrets Manager ARN holding the InternalApiKey value (shared static secret that
      authenticates climate-tracking's calls to /api/internal/*). REQUIRED: as of #189 the
      host validates this at startup (ValidateOnStart), so if it is unset the service does
      not boot at all, fails its App Runner health check, and the deploy fails outright.
      It no longer degrades to per-request 500s on /api/internal/* the way it did before
      #189 -- the failure is now earlier and total.

Resources:
  AppRunnerInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ServiceName}-instance
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: tasks.apprunner.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: read-runtime-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref TrackingJwtSecretArn
                  - !Ref DatabaseConnectionStringSecretArn
                  - !Ref InternalApiKeySecretArn
      Tags:
        - Key: Project
          Value: climate-project-api
        - Key: Environment
          Value: production

  AppRunnerService:
    Type: AWS::AppRunner::Service
    Properties:
      ServiceName: !Ref ServiceName
      SourceConfiguration:
        AuthenticationConfiguration:
          AccessRoleArn: !Ref EcrAccessRoleArn
        AutoDeploymentsEnabled: false
        ImageRepository:
          ImageIdentifier: !Ref ImageIdentifier
          ImageRepositoryType: ECR
          ImageConfiguration:
            Port: "8080"
            RuntimeEnvironmentVariables:
              - Name: ASPNETCORE_ENVIRONMENT
                Value: Production
              - Name: ASPNETCORE_URLS
                Value: http://+:8080
              - Name: Cors__AllowedOrigins__0
                Value: !Ref CorsAllowedOrigin
              - Name: Cors__AllowedWildcardOrigins__0
                Value: !Ref CorsAllowedWildcardOrigin
              # THE #220 RATCHET. Leave at "false" until the runtime secret below is on the
              # session pooler AND that deploy has been verified. Flipping the secret and
              # setting this to "true" are NOT one change and must not be attempted as one:
              # they are steps 1 and 3 of the ordered sequence at the bottom of this comment.
              #
              # "true" makes the API refuse to start when its connection string points at
              # Supabase's transaction pooler (port 6543), which is the configuration that
              # caused #220: Supavisor transaction mode hands a different backend to each
              # statement, and Npgsql holds pooled connections open across statements, so
              # roughly half of all /ready probes hung for 30 seconds.
              #
              # It is "false" today because the secret is still on 6543. Setting it to "true"
              # before flipping the secret would make the next deploy fail its health check
              # and roll back -- the deploy cannot change a Secrets Manager value.
              #
              # Ordered sequence (also in infra/aws/README.md, "Arming the guard"):
              #   1. Flip climate-project-api/prod/database-connection-string 6543 -> 5432.
              #   2. Redeploy; confirm 20+ consecutive /ready probes return 200 and the
              #      "TRANSACTION pooler" warning is gone from the App Runner logs.
              #   3. Only then change this to "true" and redeploy again.
              # Step 3 is what stops the port regressing silently later.
              - Name: Database__RequireSessionPooler
                Value: "false"
              # RATE LIMITING BEHIND THE APP RUNNER PROXY (#146).
              #
              # App Runner terminates the client connection at an AWS-managed proxy and opens
              # its own connection to this container, so HttpContext.Connection.RemoteIpAddress
              # is that proxy, not the caller. Every per-address rate limit in the app would
              # therefore share ONE bucket across the whole internet -- the first thirty
              # microclimate responses in a minute would 429 everyone else, which is a worse
              # outage than having no limit.
              #
              # "1" means "one trusted proxy appends to X-Forwarded-For, so the caller is the
              # LAST entry of that header" (ClientIpResolver.TrustedProxyHopCount; the
              # semantics match ForwardedHeadersOptions.ForwardLimit). It is safe here and
              # only here because the container is not reachable except through that proxy: a
              # caller cannot pre-seed the entry App Runner appends. Do NOT copy this value to
              # a deployment where the app is addressable directly.
              #
              # The value follows from App Runner's documented X-Forwarded-For behaviour and
              # has not been observed against a running service, because nothing in this
              # repository can. "0" restores the pre-#146 behaviour exactly and is the correct
              # thing to fall back to if it turns out to be wrong; do not guess it upward.
              - Name: RateLimiting__TrustedProxyHopCount
                Value: "1"
              # HSTS is emitted explicitly rather than by app.UseHsts(), because behind the
              # proxy above Request.IsHttps is false and UseHsts() would emit nothing at all
              # here. See SecurityOptions.EnableHsts. The public App Runner endpoint is
              # HTTPS-only, so the header is accurate.
              - Name: Security__EnableHsts
                Value: "true"
            RuntimeEnvironmentSecrets:
              - Name: TrackingJwtSecret
                Value: !Ref TrackingJwtSecretArn
              - Name: ConnectionStrings__ClimateProject
                Value: !Ref DatabaseConnectionStringSecretArn
              - Name: InternalApiKey
                Value: !Ref InternalApiKeySecretArn
      InstanceConfiguration:
        Cpu: !Ref Cpu
        Memory: !Ref Memory
        InstanceRoleArn: !GetAtt AppRunnerInstanceRole.Arn
      HealthCheckConfiguration:
        Protocol: HTTP
        Path: !Ref HealthCheckPath
        Interval: 10
        Timeout: 5
        HealthyThreshold: 1
        UnhealthyThreshold: 5
      NetworkConfiguration:
        IngressConfiguration:
          IsPubliclyAccessible: true
        EgressConfiguration:
          EgressType: DEFAULT
        IpAddressType: IPV4
      Tags:
        - Key: Project
          Value: climate-project-api
        - Key: Environment
          Value: production

Outputs:
  ServiceArn:
    Description: App Runner service ARN.
    Value: !GetAtt AppRunnerService.ServiceArn
  ServiceId:
    Description: App Runner service ID.
    Value: !GetAtt AppRunnerService.ServiceId
  ServiceUrl:
    Description: App Runner generated service URL, without protocol.
    Value: !GetAtt AppRunnerService.ServiceUrl
  InstanceRoleArn:
    Description: Runtime instance role ARN.
    Value: !GetAtt AppRunnerInstanceRole.Arn
