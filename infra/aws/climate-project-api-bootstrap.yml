AWSTemplateFormatVersion: "2010-09-09"
Description: Bootstrap resources for the climate-project-api deployment.

Parameters:
  RepositoryName:
    Type: String
    Default: climate-project-api
    Description: ECR repository name for climate-project-api images.
  GitHubRepository:
    Type: String
    Default: TIMSInternational/organizational-climate-platform
    AllowedPattern: ^[^/]+/[^/]+$
    Description: GitHub owner/repository allowed to assume the deploy role.
  GitHubBranch:
    Type: String
    Default: main
    Description: GitHub branch allowed to assume the deploy role.
  GitHubOwnerId:
    Type: String
    Default: "305569681"
    AllowedPattern: ^[0-9]+$
    Description: >-
      Immutable numeric GitHub account ID of the repository owner
      (TIMSInternational). GitHub embeds this in the OIDC subject claim, and
      unlike the owner *name* it never changes — not on an org rename, not on a
      repository transfer within the org. Re-derive with
      `gh api /repos/TIMSInternational/organizational-climate-platform --jq
      .owner.id`, or read it out of the sub template returned by
      `gh api /repos/{owner}/{repo}/actions/oidc/customization/sub`.
  GitHubRepositoryId:
    Type: String
    Default: "1317724282"
    AllowedPattern: ^[0-9]+$
    Description: >-
      Immutable numeric GitHub repository ID. Same story as GitHubOwnerId: it
      survives repository renames, which the name-based form does not.
      Re-derive with `gh api
      /repos/TIMSInternational/organizational-climate-platform --jq .id`, or read
      it out of `gh api /repos/{owner}/{repo}/actions/oidc/customization/sub`.

Resources:
  ClimateProjectApiRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Ref RepositoryName
      ImageTagMutability: MUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Expire untagged images after 7 days",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 7
                },
                "action": {
                  "type": "expire"
                }
              },
              {
                "rulePriority": 2,
                "description": "Keep the most recent 40 prod images",
                "selection": {
                  "tagStatus": "tagged",
                  "tagPrefixList": ["prod-"],
                  "countType": "imageCountMoreThan",
                  "countNumber": 40
                },
                "action": {
                  "type": "expire"
                }
              }
            ]
          }
      Tags:
        - Key: Project
          Value: climate-project-api
        - Key: Environment
          Value: production

  AppRunnerEcrAccessRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: climate-project-apprunner-ecr-access-prod
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: build.apprunner.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSAppRunnerServicePolicyForECRAccess
      Tags:
        - Key: Project
          Value: climate-project-api
        - Key: Environment
          Value: production

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: climate-project-github-deploy-prod
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                # ---------------------------------------------------------------
                # FOUR subs, deliberately. DO NOT delete the ID-qualified pair.
                # ---------------------------------------------------------------
                # GitHub issues OIDC tokens whose `sub` claim follows this
                # repository's configured sub_claim_prefix, and that prefix is the
                # ID-qualified form:
                #
                #   repo:OWNER@<ownerId>/REPO@<repoId>:ref:refs/heads/main
                #
                # not the bare `repo:OWNER/REPO:...` form AWS's own documentation
                # still shows. A policy carrying only the name-based pair can
                # therefore never match any token this repository presents — which
                # is exactly how the first production deploy failed at
                # `sts:AssumeRoleWithWebIdentity`. The ID-qualified entries are what
                # make deploys work today; removing them breaks every deploy
                # immediately, with a denial that looks like a credentials problem.
                #
                # The name-based pair is kept as well, so this template reproduces
                # the live `climate-project-github-deploy-prod` trust policy exactly
                # (verified against IAM, 2026-08-05) and so the role keeps working if
                # GitHub ever reverts a repository to the unqualified prefix. Both
                # forms are scoped to the same repo, same branch and same
                # environment, so trusting both grants nothing extra.
                #
                # Owner and repository IDs are immutable, so the ID-qualified form is
                # also the one that survives a repo or org rename — the failure mode
                # #68 was opened about. See infra/aws/README.md.
                #
                # `scripts/verify-oidc-trust-subs.py` (CI job `deploy-path-lint`)
                # fails if any of the four goes missing.
                token.actions.githubusercontent.com:sub:
                  - !Sub
                    - repo:${Owner}@${GitHubOwnerId}/${Repo}@${GitHubRepositoryId}:ref:refs/heads/${GitHubBranch}
                    - Owner: !Select [0, !Split ["/", !Ref GitHubRepository]]
                      Repo: !Select [1, !Split ["/", !Ref GitHubRepository]]
                  - !Sub
                    - repo:${Owner}@${GitHubOwnerId}/${Repo}@${GitHubRepositoryId}:environment:production
                    - Owner: !Select [0, !Split ["/", !Ref GitHubRepository]]
                      Repo: !Select [1, !Split ["/", !Ref GitHubRepository]]
                  - !Sub repo:${GitHubRepository}:ref:refs/heads/${GitHubBranch}
                  - !Sub repo:${GitHubRepository}:environment:production
      Policies:
        - PolicyName: climate-project-api-deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadBootstrapOutputs
                Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:GetTemplate
                Resource:
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/climate-project-api-bootstrap/*
              - Sid: ManageServiceStack
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:CreateStack
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStacks
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                  - cloudformation:UpdateStack
                  - cloudformation:ValidateTemplate
                Resource:
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/climate-project-api-prod/*
              - Sid: PushApiImages
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeImages
                  - ecr:DescribeRepositories
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !GetAtt ClimateProjectApiRepository.Arn
              - Sid: GetEcrAuthorizationToken
                Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: ManageAppRunnerService
                Effect: Allow
                Action:
                  - apprunner:CreateService
                  - apprunner:DeleteService
                  - apprunner:DescribeService
                  - apprunner:ListOperations
                  - apprunner:ListTagsForResource
                  - apprunner:StartDeployment
                  - apprunner:TagResource
                  - apprunner:UntagResource
                  - apprunner:UpdateService
                Resource: "*"
              - Sid: ManageAppRunnerInstanceRole
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:DeleteRolePolicy
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:PutRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:UpdateAssumeRolePolicy
                Resource:
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/climate-project-api-prod-instance
              - Sid: PassAppRunnerRoles
                Effect: Allow
                Action:
                  - iam:PassRole
                Resource:
                  - !GetAtt AppRunnerEcrAccessRole.Arn
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/climate-project-api-prod-instance
      Tags:
        - Key: Project
          Value: climate-project-api
        - Key: Environment
          Value: production

Outputs:
  EcrRepositoryName:
    Description: ECR repository name.
    Value: !Ref ClimateProjectApiRepository
  EcrRepositoryUri:
    Description: ECR repository URI.
    Value: !GetAtt ClimateProjectApiRepository.RepositoryUri
  AppRunnerEcrAccessRoleArn:
    Description: Role App Runner uses to pull private ECR images.
    Value: !GetAtt AppRunnerEcrAccessRole.Arn
  GitHubDeployRoleArn:
    Description: Role GitHub Actions assumes through OIDC for deploys.
    Value: !GetAtt GitHubDeployRole.Arn
