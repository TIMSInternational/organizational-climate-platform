AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Bootstrap resources for a climate-project-api deployment environment: ECR
  repository, the App Runner ECR access role, and the GitHub OIDC deploy role.
  ONE template for every environment (#156). The defaults are production's
  values, so deploying with defaults renders exactly the live
  climate-project-api-bootstrap stack; a staging bootstrap stack deploys from
  this same file with the staging parameter set
  (docs/runbooks/staging-provisioning.md). The deploy role's trust policy and
  resource scoping are per-environment on purpose: the staging role can touch
  only the staging stack, service and instance role, so a staging deploy that
  goes wrong cannot reach production.

Parameters:
  RepositoryName:
    Type: String
    Default: climate-project-api
    Description: >-
      ECR repository name for climate-project-api images. Each environment's
      bootstrap stack owns its own repository: in a separate AWS account the
      default name is free, but a staging stack in the SAME account as
      production must pass a distinct name (climate-project-api-staging) or
      the stack fails on the name collision.
  EnvironmentName:
    Type: String
    Default: production
    AllowedValues:
      - production
      - staging
    Description: >-
      The GitHub *environment* name whose OIDC tokens may assume the deploy
      role (it appears verbatim in the `sub` claim as `environment:<name>`),
      and the Environment tag value. Pairs with ResourceNameSuffix
      (production/prod, staging/staging); two parameters rather than one only
      because the live prod role names say "prod" while the GitHub environment
      says "production", and renaming live IAM roles orphans the deployed
      stacks.
  ResourceNameSuffix:
    Type: String
    Default: prod
    AllowedValues:
      - prod
      - staging
    Description: >-
      Short suffix in every named resource this stack creates or scopes to:
      climate-project-github-deploy-<suffix>,
      climate-project-apprunner-ecr-access-<suffix>, and the service-stack and
      instance-role ARNs the deploy policy is limited to
      (climate-project-api-<suffix>, climate-project-api-<suffix>-instance).
      Must agree with the service stack's ServiceName or the deploy role
      cannot manage the stack it deploys.
  ImageTagPrefix:
    Type: String
    Default: prod-
    AllowedValues:
      - prod-
      - staging-
    Description: >-
      Image tag prefix the ECR lifecycle policy retains (most recent 40).
      Must match what the environment's deploy workflow tags: deploy-prod.yml
      pushes prod-<sha>/prod-latest, deploy-staging.yml pushes
      staging-<sha>/staging-latest. A mismatch does not fail anything loudly
      -- it silently exempts every deployed image from the 40-image cap, so
      the repository grows without bound.
  GitHubRepository:
    Type: String
    Default: TIMSInternational/organizational-climate-platform
    AllowedPattern: ^[^/]+/[^/]+$
    Description: GitHub owner/repository allowed to assume the deploy role.
  GitHubBranch:
    Type: String
    Default: main
    Description: GitHub branch allowed to assume the deploy role.
  GitHubOwnerId:
    Type: String
    Default: "305569681"
    AllowedPattern: ^[0-9]+$
    Description: >-
      Immutable numeric GitHub account ID of the repository owner
      (TIMSInternational). GitHub embeds this in the OIDC subject claim, and
      unlike the owner *name* it never changes — not on an org rename, not on a
      repository transfer within the org. Re-derive with
      `gh api /repos/TIMSInternational/organizational-climate-platform --jq
      .owner.id`, or read it out of the sub template returned by
      `gh api /repos/{owner}/{repo}/actions/oidc/customization/sub`.
  GitHubRepositoryId:
    Type: String
    Default: "1317724282"
    AllowedPattern: ^[0-9]+$
    Description: >-
      Immutable numeric GitHub repository ID. Same story as GitHubOwnerId: it
      survives repository renames, which the name-based form does not.
      Re-derive with `gh api
      /repos/TIMSInternational/organizational-climate-platform --jq .id`, or read
      it out of `gh api /repos/{owner}/{repo}/actions/oidc/customization/sub`.

Resources:
  ClimateProjectApiRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Ref RepositoryName
      ImageTagMutability: MUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        # !Sub renders ${ImageTagPrefix} into the JSON. The one rendered
        # difference from the pre-#156 literal is rule 2's description string
        # ("prod images" -> "prod-* images") -- cosmetic, kept honest so a
        # staging repository's rule does not claim to be about prod images.
        LifecyclePolicyText: !Sub |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Expire untagged images after 7 days",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 7
                },
                "action": {
                  "type": "expire"
                }
              },
              {
                "rulePriority": 2,
                "description": "Keep the most recent 40 ${ImageTagPrefix}* images",
                "selection": {
                  "tagStatus": "tagged",
                  "tagPrefixList": ["${ImageTagPrefix}"],
                  "countType": "imageCountMoreThan",
                  "countNumber": 40
                },
                "action": {
                  "type": "expire"
                }
              }
            ]
          }
      Tags:
        - Key: Project
          Value: climate-project-api
        - Key: Environment
          Value: !Ref EnvironmentName

  AppRunnerEcrAccessRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub climate-project-apprunner-ecr-access-${ResourceNameSuffix}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: build.apprunner.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSAppRunnerServicePolicyForECRAccess
      Tags:
        - Key: Project
          Value: climate-project-api
        - Key: Environment
          Value: !Ref EnvironmentName

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub climate-project-github-deploy-${ResourceNameSuffix}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                # ---------------------------------------------------------------
                # FOUR subs, deliberately. DO NOT delete the ID-qualified pair.
                # ---------------------------------------------------------------
                # GitHub issues OIDC tokens whose `sub` claim follows this
                # repository's configured sub_claim_prefix, and that prefix is the
                # ID-qualified form:
                #
                #   repo:OWNER@<ownerId>/REPO@<repoId>:ref:refs/heads/main
                #
                # not the bare `repo:OWNER/REPO:...` form AWS's own documentation
                # still shows. A policy carrying only the name-based pair can
                # therefore never match any token this repository presents — which
                # is exactly how the first production deploy failed at
                # `sts:AssumeRoleWithWebIdentity`. The ID-qualified entries are what
                # make deploys work today; removing them breaks every deploy
                # immediately, with a denial that looks like a credentials problem.
                #
                # The name-based pair is kept as well, so this template reproduces
                # the live `climate-project-github-deploy-prod` trust policy exactly
                # (verified against IAM, 2026-08-05) and so the role keeps working if
                # GitHub ever reverts a repository to the unqualified prefix. Both
                # forms are scoped to the same repo, same branch and same
                # environment, so trusting both grants nothing extra.
                #
                # Owner and repository IDs are immutable, so the ID-qualified form is
                # also the one that survives a repo or org rename — the failure mode
                # #68 was opened about. See infra/aws/README.md.
                #
                # `scripts/verify-oidc-trust-subs.py` (CI job `deploy-path-lint`)
                # fails if any of the four goes missing.
                #
                # The environment half is `environment:${EnvironmentName}`
                # (#156): a staging bootstrap stack renders
                # `environment:staging` here, so the staging deploy role
                # trusts staging jobs and nothing production. Rendered with
                # the defaults, these are byte-for-byte the four subs the live
                # prod role trusts, which is what the guard script asserts.
                token.actions.githubusercontent.com:sub:
                  - !Sub
                    - repo:${Owner}@${GitHubOwnerId}/${Repo}@${GitHubRepositoryId}:ref:refs/heads/${GitHubBranch}
                    - Owner: !Select [0, !Split ["/", !Ref GitHubRepository]]
                      Repo: !Select [1, !Split ["/", !Ref GitHubRepository]]
                  - !Sub
                    - repo:${Owner}@${GitHubOwnerId}/${Repo}@${GitHubRepositoryId}:environment:${EnvironmentName}
                    - Owner: !Select [0, !Split ["/", !Ref GitHubRepository]]
                      Repo: !Select [1, !Split ["/", !Ref GitHubRepository]]
                  - !Sub repo:${GitHubRepository}:ref:refs/heads/${GitHubBranch}
                  - !Sub repo:${GitHubRepository}:environment:${EnvironmentName}
      Policies:
        - PolicyName: climate-project-api-deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadBootstrapOutputs
                Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:GetTemplate
                Resource:
                  # ${AWS::StackName}: the deploy role reads THIS stack's
                  # outputs, whatever this stack is named -- for the live prod
                  # stack that renders the same climate-project-api-bootstrap
                  # ARN as the previous literal did.
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*
              - Sid: ManageServiceStack
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:CreateStack
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStacks
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                  - cloudformation:UpdateStack
                  - cloudformation:ValidateTemplate
                Resource:
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/climate-project-api-${ResourceNameSuffix}/*
              - Sid: PushApiImages
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeImages
                  - ecr:DescribeRepositories
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !GetAtt ClimateProjectApiRepository.Arn
              - Sid: GetEcrAuthorizationToken
                Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: ManageAppRunnerService
                Effect: Allow
                Action:
                  - apprunner:CreateService
                  - apprunner:DeleteService
                  - apprunner:DescribeService
                  - apprunner:ListOperations
                  - apprunner:ListTagsForResource
                  - apprunner:StartDeployment
                  - apprunner:TagResource
                  - apprunner:UntagResource
                  - apprunner:UpdateService
                Resource: "*"
              - Sid: ManageAppRunnerInstanceRole
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:DeleteRolePolicy
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:PutRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:UpdateAssumeRolePolicy
                Resource:
                  # climate-project-api-<suffix>-instance is what the service
                  # template names its AppRunnerInstanceRole
                  # (!Sub ${ServiceName}-instance), so this scoping holds only
                  # while ResourceNameSuffix agrees with the service stack's
                  # ServiceName -- see the parameter description.
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/climate-project-api-${ResourceNameSuffix}-instance
              - Sid: PassAppRunnerRoles
                Effect: Allow
                Action:
                  - iam:PassRole
                Resource:
                  - !GetAtt AppRunnerEcrAccessRole.Arn
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/climate-project-api-${ResourceNameSuffix}-instance
      Tags:
        - Key: Project
          Value: climate-project-api
        - Key: Environment
          Value: !Ref EnvironmentName

Outputs:
  EcrRepositoryName:
    Description: ECR repository name.
    Value: !Ref ClimateProjectApiRepository
  EcrRepositoryUri:
    Description: ECR repository URI.
    Value: !GetAtt ClimateProjectApiRepository.RepositoryUri
  AppRunnerEcrAccessRoleArn:
    Description: Role App Runner uses to pull private ECR images.
    Value: !GetAtt AppRunnerEcrAccessRole.Arn
  GitHubDeployRoleArn:
    Description: Role GitHub Actions assumes through OIDC for deploys.
    Value: !GetAtt GitHubDeployRole.Arn
