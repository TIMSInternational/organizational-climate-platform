<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Climate">
  <title>Climate</title>
  <!-- The product mark: the Panel de Control's "Por grupo" heat grid reduced to a logo.
       The ramp is mirrored under a dark browser chrome, because the light ramp's two
       deepest cells measure 1.13:1 and 1.25:1 on a navy ground and simply disappear. -->
  <style>
    .c1 { fill: #c9d8f0; }
    .c2 { fill: #7ba0f6; }
    .c3 { fill: #4d76c7; }
    .c4 { fill: #122478; }
    .c5 { fill: #070f21; }
    .c0 { fill: #e40508; }
    @media (prefers-color-scheme: dark) {
      .c1 { fill: #2f4e8f; }
      .c2 { fill: #4d76c7; }
      .c3 { fill: #7ba0f6; }
      .c4 { fill: #c9d8f0; }
      .c5 { fill: #edf0f9; }
      .c0 { fill: #e40508; }
    }
  </style>
  <rect class="c1" x="0" y="0" width="29.2" height="29.2" rx="7.2"/>
  <rect class="c1" x="35.4" y="0" width="29.2" height="29.2" rx="7.2"/>
  <rect class="c2" x="70.8" y="0" width="29.2" height="29.2" rx="7.2"/>
  <rect class="c3" x="0" y="35.4" width="29.2" height="29.2" rx="7.2"/>
  <rect class="c3" x="35.4" y="35.4" width="29.2" height="29.2" rx="7.2"/>
  <rect class="c4" x="70.8" y="35.4" width="29.2" height="29.2" rx="7.2"/>
  <rect class="c5" x="0" y="70.8" width="29.2" height="29.2" rx="7.2"/>
  <rect class="c5" x="35.4" y="70.8" width="29.2" height="29.2" rx="7.2"/>
  <rect class="c0" x="70.8" y="70.8" width="29.2" height="29.2" rx="7.2"/>
</svg>
