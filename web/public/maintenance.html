<title>En mantenimiento · Under maintenance</title>
<!--
  The page that stands in for the product while the product is down (cutover.md, C8).

  Self-contained on purpose: no script, no stylesheet, no font, no image request. If this
  file is being served, something else is not, and a page that needs a second request to
  render is a page that can fail for the same reason the app did. The one asset is the
  favicon, inlined below as a data URI.

  Colours are the storefront palette copied as literals — src/styles/storefront.css:73-94
  (light) and :141-155 (dark), each with the contrast ratio measured in that file. The app
  itself has no prefers-color-scheme block by design (src/styles/tokens.css:833-846: the
  attribute is written by src/theme/adminTheme.ts). This page has no app to write an
  attribute for it, so the OS preference is the only signal there is.

  The words are the in-app maintenance copy (web/src/i18n/es.json and en.json,
  auth.maintenanceTitle / auth.maintenanceDetail) so that the 503 screen the app shows
  when only the API is down and this page agree with each other. Spanish first: the
  client is a Costa Rican institution.

  No date, no ETA, no status link: anything with a clock in it goes stale inside the
  window it describes.
-->
