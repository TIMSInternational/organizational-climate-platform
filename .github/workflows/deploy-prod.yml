name: deploy-prod

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  BOOTSTRAP_STACK_NAME: climate-project-api-bootstrap
  SERVICE_STACK_NAME: climate-project-api-prod
  SERVICE_NAME: climate-project-api-prod
  # App Runner's own health-check path. /ready, which round-trips Postgres -- NOT the
  # static /health, which this file used to specify for the reason recorded here so it
  # is not re-argued from scratch: App Runner tears down instances that fail this
  # probe, so a database-dependent probe lets a Postgres blip destroy a healthy
  # service.
  #
  # That objection was right about the mechanism and wrong about the balance of harm.
  # /health is a literal that opens no connection, so an instance that has lost its
  # database passes it FOREVER and is never replaced or drained (#221) -- the deploy
  # canary below catches a broken rollout once, at rollout, and nothing catches an
  # instance that degrades afterwards. Trading "a blip might cost an instance" for
  # "a dead instance serves errors indefinitely" is the wrong way round.
  #
  # The blip case is answered by the thresholds instead, not by the path: the service
  # template gives an instance ~100 seconds of CONTINUOUS failure before replacement,
  # and the reasoning for each number is on HealthCheckConfiguration there.
  #
  # This was blocked until 2026-08-11 for a real reason, not a stale one: while #220
  # had /ready failing ~50% of probes, pointing App Runner at it would have replaced
  # instances continuously and turned an intermittent latency bug into a rolling
  # outage. #220 is fixed and closed; 20 of 20 consecutive /ready probes return 200.
  HEALTH_CHECK_PATH: /ready
  # Passed explicitly rather than relying on the template defaults. See the comment
  # on the deploy step for why every parameter is now supplied.
  SERVICE_CPU: 0.25 vCPU
  SERVICE_MEMORY: 0.5 GB

jobs:
  deploy:
    name: Deploy prod API
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fails in seconds, before any image is built or pushed, if the deploy is
      # missing configuration. Previously a missing value surfaced either as an
      # opaque CloudFormation "parameter not supplied" error ~10 minutes in, or --
      # worse -- not at all, because `aws cloudformation deploy` silently reuses the
      # previous value on an update.
      - name: Verify deploy configuration is present
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          CORS_ALLOWED_ORIGIN: ${{ vars.CORS_ALLOWED_ORIGIN }}
          CORS_ALLOWED_WILDCARD_ORIGIN: ${{ vars.CORS_ALLOWED_WILDCARD_ORIGIN }}
          TRACKING_JWT_SECRET_ARN: ${{ vars.TRACKING_JWT_SECRET_ARN }}
          DATABASE_CONNECTION_STRING_SECRET_ARN: ${{ vars.DATABASE_CONNECTION_STRING_SECRET_ARN }}
          INTERNAL_API_KEY_SECRET_ARN: ${{ vars.INTERNAL_API_KEY_SECRET_ARN }}
          MIGRATION_DATABASE_CONNECTION_STRING: ${{ secrets.MIGRATION_DATABASE_CONNECTION_STRING }}
        run: |
          set -euo pipefail
          missing=0
          for name in \
            AWS_ACCOUNT_ID \
            CORS_ALLOWED_ORIGIN \
            CORS_ALLOWED_WILDCARD_ORIGIN \
            TRACKING_JWT_SECRET_ARN \
            DATABASE_CONNECTION_STRING_SECRET_ARN \
            INTERNAL_API_KEY_SECRET_ARN \
            MIGRATION_DATABASE_CONNECTION_STRING; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is empty. Set it on the 'production' environment (repository variable, or secret for MIGRATION_DATABASE_CONNECTION_STRING) before dispatching this workflow."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Refusing to deploy with incomplete configuration." >&2
            exit 1
          fi
          echo "All required deploy configuration is present."

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Test API
        run: dotnet test ClimateProject.slnx --configuration Release

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/climate-project-github-deploy-prod

      - name: Read bootstrap outputs
        id: bootstrap
        run: |
          set -euo pipefail
          ECR_REPOSITORY_URI="$(aws cloudformation describe-stacks \
            --stack-name "$BOOTSTRAP_STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='EcrRepositoryUri'].OutputValue | [0]" \
            --output text)"
          ECR_ACCESS_ROLE_ARN="$(aws cloudformation describe-stacks \
            --stack-name "$BOOTSTRAP_STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='AppRunnerEcrAccessRoleArn'].OutputValue | [0]" \
            --output text)"
          if [ -z "$ECR_REPOSITORY_URI" ] || [ "$ECR_REPOSITORY_URI" = "None" ]; then
            echo "Missing EcrRepositoryUri output from $BOOTSTRAP_STACK_NAME" >&2
            exit 1
          fi
          if [ -z "$ECR_ACCESS_ROLE_ARN" ] || [ "$ECR_ACCESS_ROLE_ARN" = "None" ]; then
            echo "Missing AppRunnerEcrAccessRoleArn output from $BOOTSTRAP_STACK_NAME" >&2
            exit 1
          fi
          ECR_REGISTRY="${ECR_REPOSITORY_URI%/*}"
          {
            echo "ecr_repository_uri=$ECR_REPOSITORY_URI"
            echo "ecr_registry=$ECR_REGISTRY"
            echo "ecr_access_role_arn=$ECR_ACCESS_ROLE_ARN"
          } >> "$GITHUB_OUTPUT"

      - name: Login to ECR
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "${{ steps.bootstrap.outputs.ecr_registry }}"

      - name: Build and push API image
        id: image
        run: |
          set -euo pipefail
          IMAGE_TAG="prod-${GITHUB_SHA}"
          IMAGE_URI="${{ steps.bootstrap.outputs.ecr_repository_uri }}:${IMAGE_TAG}"
          BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          docker build --platform linux/amd64 \
            --build-arg "COMMIT_SHA=${GITHUB_SHA}" \
            --build-arg "BUILD_TIMESTAMP=${BUILD_TIMESTAMP}" \
            -t "$IMAGE_URI" .
          docker tag "$IMAGE_URI" "${{ steps.bootstrap.outputs.ecr_repository_uri }}:prod-latest"
          docker push "$IMAGE_URI"
          docker push "${{ steps.bootstrap.outputs.ecr_repository_uri }}:prod-latest"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      # Applied *before* the new image is deployed, so the schema is never behind the
      # code that expects it. There was previously no migration step here at all and
      # no Migrate() call anywhere in src/, so a fully green deploy shipped code
      # against whatever schema the database happened to already have.
      #
      # KNOWN WINDOW, deliberately accepted: between this step and the App Runner
      # rollout below, the currently-live (old) code runs against the new schema.
      # That is safe for purely additive migrations but NOT for rewrites -- notably
      # 20260804002058_RenameOpenTextQuestionTypeToOpenEnded, which rewrites existing
      # question-type rows from 'open_text' to 'open_ended'. Old code reading those
      # rows will not recognise the new value until the rollout completes. For that
      # migration specifically the exposure is a few minutes of a dark service; if a
      # future migration cannot tolerate this window it needs the expand/contract
      # treatment (deploy tolerant code first, migrate second) rather than a change
      # to this step's position.
      - name: Apply EF Core migrations
        env:
          # The Supabase SESSION pooler: the SAME host as the runtime connection
          # string, but port 5432 (session mode) rather than 6543 (transaction mode),
          # with the username in the `postgres.<project-ref>` form the pooler wants.
          # In practice: take the runtime string and change 6543 to 5432.
          #
          # Two different wrong answers are guarded below. They fail for unrelated
          # reasons, which is why there are two guards and not one:
          #
          #  1. Port 6543 -- WRONG SEMANTICS. Supavisor in transaction mode hands a
          #     different backend to each statement, which breaks the session-scoped
          #     advisory lock EF takes to serialise migrations, and the
          #     multi-statement transactions the migrations run in.
          #
          #  2. Host db.<project-ref>.supabase.co -- WRONG ROUTING. This is what the
          #     Supabase dashboard calls the "direct connection", and revisions of
          #     this file before #212 recommended it. It publishes an AAAA record and
          #     NO A record -- it is IPv6-only -- and GitHub Actions runners are
          #     IPv4-only, so it is unroutable from here regardless of credentials.
          #     It works fine from a developer workstation on an IPv6 network, which
          #     is how the bad advice survived. Unguarded it would fail at connect
          #     with a timeout, reading like a transient network fault rather than a
          #     misconfigured secret, so guard 2 rejects it by name in seconds and
          #     says why.
          #
          # Neither guard validates the credential -- the preflight step is an
          # emptiness check, not a validity check -- so these catch the two known
          # shapes of wrong, not every wrong value.
          ConnectionStrings__ClimateProject: ${{ secrets.MIGRATION_DATABASE_CONNECTION_STRING }}
        run: |
          set -euo pipefail

          # Guard 1 (unchanged condition): reject transaction mode.
          if printf '%s' "$ConnectionStrings__ClimateProject" | grep -qE '(^|[^0-9])6543([^0-9]|$)'; then
            echo "::error::MIGRATION_DATABASE_CONNECTION_STRING points at port 6543 (the Supabase transaction-mode pooler). EF Core migrations need session mode: the same host on port 5432, username postgres.<project-ref>." >&2
            exit 1
          fi

          # Guard 2: reject the IPv6-only direct host. Fails in seconds with a reason
          # instead of hanging until the TCP connect times out. See the comment above.
          if printf '%s' "$ConnectionStrings__ClimateProject" | grep -qE 'db\.[a-z0-9-]+\.supabase\.co'; then
            echo "::error::MIGRATION_DATABASE_CONNECTION_STRING points at db.<project-ref>.supabase.co (the Supabase 'direct connection'). That host is IPv6-only -- it publishes an AAAA record and no A record -- and GitHub Actions runners are IPv4-only, so it can never be reached from this workflow. Use the session pooler instead: the same host as the runtime connection string, port 5432 (not 6543), username postgres.<project-ref>." >&2
            exit 1
          fi

          dotnet tool restore
          dotnet dotnet-ef database update \
            --project src/ClimateProject.Infrastructure \
            --startup-project src/ClimateProject.Api \
            --configuration Release

      # Every parameter is now passed explicitly, including the ones that have
      # template defaults. `aws cloudformation deploy` reuses a parameter's PREVIOUS
      # STACK VALUE when it is omitted -- it does not fall back to the template
      # default -- so omitting parameters made the deployed configuration a function
      # of invisible prior stack state rather than of this repository. Concretely:
      # this step used to pass 3 of the template's 11 parameters, and
      # InternalApiKeySecretArn (added 2026-08-01, after this workflow was last
      # touched on 2026-07-30) would have failed the first dispatch outright unless
      # it had already been supplied by hand.
      #
      # CORS_ADDITIONAL_ALLOWED_ORIGIN and CORS_ADDITIONAL_ALLOWED_WILDCARD_ORIGIN are
      # deliberately NOT in the preflight check above: they are optional (#160), and an
      # unset repository variable expands to an empty string, which the template's
      # conditions read as "no second origin" and drop the entry entirely. Passing them
      # unconditionally is what makes CLEARING one work -- omit them instead and
      # `aws cloudformation deploy` would keep the previous stack value, so removing a
      # decommissioned domain from the allowlist would silently not happen.
      - name: Deploy App Runner service stack
        run: |
          set -euo pipefail
          aws cloudformation deploy \
            --stack-name "$SERVICE_STACK_NAME" \
            --template-file infra/aws/climate-project-api-prod-service.yml \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              ServiceName="$SERVICE_NAME" \
              ImageIdentifier="${{ steps.image.outputs.image_uri }}" \
              EcrAccessRoleArn="${{ steps.bootstrap.outputs.ecr_access_role_arn }}" \
              HealthCheckPath="$HEALTH_CHECK_PATH" \
              Cpu="$SERVICE_CPU" \
              Memory="$SERVICE_MEMORY" \
              CorsAllowedOrigin="${{ vars.CORS_ALLOWED_ORIGIN }}" \
              CorsAllowedWildcardOrigin="${{ vars.CORS_ALLOWED_WILDCARD_ORIGIN }}" \
              CorsAdditionalAllowedOrigin="${{ vars.CORS_ADDITIONAL_ALLOWED_ORIGIN }}" \
              CorsAdditionalAllowedWildcardOrigin="${{ vars.CORS_ADDITIONAL_ALLOWED_WILDCARD_ORIGIN }}" \
              TrackingJwtSecretArn="${{ vars.TRACKING_JWT_SECRET_ARN }}" \
              DatabaseConnectionStringSecretArn="${{ vars.DATABASE_CONNECTION_STRING_SECRET_ARN }}" \
              InternalApiKeySecretArn="${{ vars.INTERNAL_API_KEY_SECRET_ARN }}"

      - name: Read App Runner URL
        id: service
        run: |
          set -euo pipefail
          SERVICE_URL="$(aws cloudformation describe-stacks \
            --stack-name "$SERVICE_STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='ServiceUrl'].OutputValue | [0]" \
            --output text)"
          if [ -z "$SERVICE_URL" ] || [ "$SERVICE_URL" = "None" ]; then
            echo "Missing ServiceUrl output from $SERVICE_STACK_NAME" >&2
            exit 1
          fi
          echo "base_url=https://$SERVICE_URL" >> "$GITHUB_OUTPUT"

      # Gates on /ready, not /health. /health is a static literal that cannot observe
      # the database, so the old canary would pass against an instance whose
      # connection string was wrong or whose database was unreachable -- the deploy
      # was then reported successful and every real request 500'd. /ready performs a
      # `SELECT 1` round-trip, so a 200 here means the instance can actually serve.
      #
      # CONSECUTIVE successes, and a failure resets the count to zero. That is the
      # whole point (#300): the previous version exited 0 on the FIRST 200 of up to
      # ten attempts, and #220's defect alternated 200 / 30s-timeout at roughly 50%,
      # so a thoroughly broken instance passed this gate on attempt one about half the
      # time and on attempt two nearly always. "One green probe proves nothing" is the
      # standard infra/aws/README.md already specified -- 20+ consecutive -- and this
      # is that standard implemented rather than described.
      - name: Readiness canary
        env:
          # 20 from infra/aws/README.md's acceptance criterion for #220. Against the
          # alternating-50% signature, 20 consecutive is a 1-in-a-million pass.
          REQUIRED_CONSECUTIVE: 20
          PROBE_INTERVAL_SECONDS: 5
          # A wall clock, not an attempt count: because a failure resets the run, an
          # attempt budget bounds attempts but not time. 20 probes at 5s spacing needs
          # ~105s, so 300s absorbs a couple of resets and still fails the job in five
          # minutes rather than grinding toward the six-hour ceiling.
          DEADLINE_SECONDS: 300
          # Above the 9.4s cold-start probe measured post-deploy in #220 (EF model
          # build plus first pooled connection), below the 30s hang that was #220's
          # signature. A probe slower than this is a failure for canary purposes --
          # and since a failure only resets the run, a slow warm-up costs time, not
          # the deploy.
          PROBE_TIMEOUT_SECONDS: 15
        run: |
          set -euo pipefail
          URL="${{ steps.service.outputs.base_url }}/ready"
          deadline=$(( $(date +%s) + DEADLINE_SECONDS ))
          consecutive=0
          best=0
          attempt=0

          while [ "$(date +%s)" -lt "$deadline" ]; do
            attempt=$(( attempt + 1 ))
            status=$(curl -s -o /tmp/ready_body -w "%{http_code}" \
              --max-time "$PROBE_TIMEOUT_SECONDS" "$URL" || echo "000")

            if [ "$status" = "200" ]; then
              consecutive=$(( consecutive + 1 ))
              [ "$consecutive" -gt "$best" ] && best=$consecutive
              echo "probe $attempt: 200 ($consecutive/$REQUIRED_CONSECUTIVE consecutive)"
              if [ "$consecutive" -ge "$REQUIRED_CONSECUTIVE" ]; then
                echo "Readiness canary passed: $REQUIRED_CONSECUTIVE consecutive 200s in $attempt probes."
                cat /tmp/ready_body
                exit 0
              fi
            else
              echo "probe $attempt: status $status -- run of $consecutive reset to 0"
              [ -s /tmp/ready_body ] && cat /tmp/ready_body
              consecutive=0
            fi

            sleep "$PROBE_INTERVAL_SECONDS"
          done

          echo "::error::Readiness canary failed: needed $REQUIRED_CONSECUTIVE consecutive 200s from $URL within ${DEADLINE_SECONDS}s, and the longest run in $attempt probes was $best. A run that keeps resetting is the #220 signature -- an intermittently-failing database connection, not a cold start." >&2
          exit 1

      # The step that makes deploy drift impossible to miss. /version now reports the
      # commit the running image was built from, so the deploy can assert that what
      # is live is what this run just built. Without this a deploy that pushed an
      # image but failed to roll it out (App Runner keeping the previous revision)
      # still reported success -- which is how production came to sit 156 commits
      # behind main unnoticed.
      - name: Verify deployed commit matches this run
        run: |
          set -euo pipefail
          DEPLOYED_COMMIT="$(scripts/read-deployed-commit.sh "${{ steps.service.outputs.base_url }}")"
          if [ "$DEPLOYED_COMMIT" != "$GITHUB_SHA" ]; then
            echo "::error::Live service reports commit '$DEPLOYED_COMMIT' but this run deployed '$GITHUB_SHA'. The rollout did not take effect." >&2
            exit 1
          fi
          echo "Live service is running the expected commit: $GITHUB_SHA"
