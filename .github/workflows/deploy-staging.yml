name: deploy-staging

# Deploys climate-project-api to the STAGING environment (#156). Modeled on
# deploy-prod.yml step for step -- same preflight, same tests, same EF migration
# guards, same 20-consecutive readiness canary, same deployed-commit assertion.
# The "Readiness canary" and "Verify deployed commit matches this run" steps are
# VERBATIM copies of deploy-prod.yml's, and scripts/verify-prod-deploy-invariants.py
# fails CI if they drift: the whole value of staging is that it exercises the same
# deploy path as production, so a staging canary with a lower bar would be
# rehearsing a different play.
#
# What differs from deploy-prod.yml, exhaustively:
#   - GitHub environment `staging` (its variables/secrets below), not `production`.
#   - Stack/service/role names carry -staging; images are tagged staging-<sha>.
#   - The service stack is deployed with EnvironmentName=staging /
#     AspNetCoreEnvironment=Staging (same template file; #156 parameterised it).
#
# ---------------------------------------------------------------------------------
# REQUIRED CONFIGURATION -- on the `staging` GitHub environment, which DOES NOT
# EXIST until step 1 of docs/runbooks/staging-provisioning.md creates it. Every
# value is checked for presence by the first step below, and the ones the app
# reads are additionally validated at startup (ValidateOnStart, #189): a missing
# or wrong secret means the service refuses to boot, fails its /ready health
# check, and this workflow fails at the canary. Loud, early failure is the
# posture; there are no fallbacks to production values anywhere in this file.
#
# | Name | Kind | Value |
# |---|---|---|
# | AWS_ACCOUNT_ID | variable | The account staging lives in -- decided in the
# |   | | runbook (DEV 795965600143 or the prod account 747814092517). |
# | CORS_ALLOWED_ORIGIN | variable | Exact staging frontend origin (the staging
# |   | | Vercel project's production URL, runbook step 5). |
# | CORS_ALLOWED_WILDCARD_ORIGIN | variable | Staging Vercel preview pattern,
# |   | | e.g. https://*.vercel.app -- must contain a '*'. |
# | CORS_ADDITIONAL_ALLOWED_ORIGIN | variable, optional | Second exact origin;
# |   | | unset/empty means the template drops the slot entirely (#160). |
# | CORS_ADDITIONAL_ALLOWED_WILDCARD_ORIGIN | variable, optional | Second
# |   | | wildcard pattern; same empty-means-absent rule, and load-bearing:
# |   | | an empty wildcard fails the host at startup. |
# | TRACKING_JWT_SECRET_ARN | variable | Secrets Manager ARN,
# |   | | climate-project-api/staging/tracking-jwt-secret. A STAGING value,
# |   | | not production's: sharing the signing key would let staging tokens
# |   | | authenticate against prod. |
# | DATABASE_CONNECTION_STRING_SECRET_ARN | variable | Secrets Manager ARN,
# |   | | climate-project-api/staging/database-connection-string. Session
# |   | | pooler, port 5432 -- same rules as prod (#220). |
# | INTERNAL_API_KEY_SECRET_ARN | variable | Secrets Manager ARN,
# |   | | climate-project-api/staging/internal-api-key. |
# | MIGRATION_DATABASE_CONNECTION_STRING | SECRET | The STAGING database's
# |   | | session pooler string: port 5432, username postgres.<project-ref>,
# |   | | never db.<ref>.supabase.co (IPv6-only; unreachable from Actions).
# |   | | Both wrong shapes are rejected by the guards below, same as prod. |
# ---------------------------------------------------------------------------------
#
# The IAM role this workflow assumes, climate-project-github-deploy-staging, is
# created by the staging bootstrap stack (infra/aws/climate-project-api-bootstrap.yml
# with the staging parameter set -- runbook step 4). Its trust policy accepts only
# `environment:staging` (and main-branch) OIDC subs, and its permissions reach only
# the climate-project-api-staging stack, service and instance role, so this
# workflow cannot touch production even if dispatched with production's values.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  BOOTSTRAP_STACK_NAME: climate-project-api-staging-bootstrap
  SERVICE_STACK_NAME: climate-project-api-staging
  SERVICE_NAME: climate-project-api-staging
  # /ready, NOT /health, for the reasons argued at length in deploy-prod.yml and
  # infra/aws/README.md (#221): a static /health passes forever on an instance
  # that has lost its database. Must stay equal to prod's value -- the invariants
  # guard asserts the template default and deploy-prod.yml agree, and that this
  # file agrees with deploy-prod.yml.
  HEALTH_CHECK_PATH: /ready
  SERVICE_CPU: 0.25 vCPU
  SERVICE_MEMORY: 0.5 GB

jobs:
  deploy:
    name: Deploy staging API
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fails in seconds, before any image is built or pushed, if the deploy is
      # missing configuration -- same preflight as deploy-prod.yml, pointed at the
      # staging environment. An unset repository/environment variable expands to
      # an empty string, which is exactly what this catches.
      - name: Verify deploy configuration is present
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          CORS_ALLOWED_ORIGIN: ${{ vars.CORS_ALLOWED_ORIGIN }}
          CORS_ALLOWED_WILDCARD_ORIGIN: ${{ vars.CORS_ALLOWED_WILDCARD_ORIGIN }}
          TRACKING_JWT_SECRET_ARN: ${{ vars.TRACKING_JWT_SECRET_ARN }}
          DATABASE_CONNECTION_STRING_SECRET_ARN: ${{ vars.DATABASE_CONNECTION_STRING_SECRET_ARN }}
          INTERNAL_API_KEY_SECRET_ARN: ${{ vars.INTERNAL_API_KEY_SECRET_ARN }}
          MIGRATION_DATABASE_CONNECTION_STRING: ${{ secrets.MIGRATION_DATABASE_CONNECTION_STRING }}
        run: |
          set -euo pipefail
          missing=0
          for name in \
            AWS_ACCOUNT_ID \
            CORS_ALLOWED_ORIGIN \
            CORS_ALLOWED_WILDCARD_ORIGIN \
            TRACKING_JWT_SECRET_ARN \
            DATABASE_CONNECTION_STRING_SECRET_ARN \
            INTERNAL_API_KEY_SECRET_ARN \
            MIGRATION_DATABASE_CONNECTION_STRING; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is empty. Set it on the 'staging' GitHub environment (repository variable, or secret for MIGRATION_DATABASE_CONNECTION_STRING) -- see docs/runbooks/staging-provisioning.md step 1 -- before dispatching this workflow."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Refusing to deploy with incomplete configuration." >&2
            exit 1
          fi
          echo "All required deploy configuration is present."

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Test API
        run: dotnet test ClimateProject.slnx --configuration Release

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/climate-project-github-deploy-staging

      - name: Read bootstrap outputs
        id: bootstrap
        run: |
          set -euo pipefail
          ECR_REPOSITORY_URI="$(aws cloudformation describe-stacks \
            --stack-name "$BOOTSTRAP_STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='EcrRepositoryUri'].OutputValue | [0]" \
            --output text)"
          ECR_ACCESS_ROLE_ARN="$(aws cloudformation describe-stacks \
            --stack-name "$BOOTSTRAP_STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='AppRunnerEcrAccessRoleArn'].OutputValue | [0]" \
            --output text)"
          if [ -z "$ECR_REPOSITORY_URI" ] || [ "$ECR_REPOSITORY_URI" = "None" ]; then
            echo "Missing EcrRepositoryUri output from $BOOTSTRAP_STACK_NAME" >&2
            exit 1
          fi
          if [ -z "$ECR_ACCESS_ROLE_ARN" ] || [ "$ECR_ACCESS_ROLE_ARN" = "None" ]; then
            echo "Missing AppRunnerEcrAccessRoleArn output from $BOOTSTRAP_STACK_NAME" >&2
            exit 1
          fi
          ECR_REGISTRY="${ECR_REPOSITORY_URI%/*}"
          {
            echo "ecr_repository_uri=$ECR_REPOSITORY_URI"
            echo "ecr_registry=$ECR_REGISTRY"
            echo "ecr_access_role_arn=$ECR_ACCESS_ROLE_ARN"
          } >> "$GITHUB_OUTPUT"

      - name: Login to ECR
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "${{ steps.bootstrap.outputs.ecr_registry }}"

      - name: Build and push API image
        id: image
        run: |
          set -euo pipefail
          IMAGE_TAG="staging-${GITHUB_SHA}"
          IMAGE_URI="${{ steps.bootstrap.outputs.ecr_repository_uri }}:${IMAGE_TAG}"
          BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          docker build --platform linux/amd64 \
            --build-arg "COMMIT_SHA=${GITHUB_SHA}" \
            --build-arg "BUILD_TIMESTAMP=${BUILD_TIMESTAMP}" \
            -t "$IMAGE_URI" .
          docker tag "$IMAGE_URI" "${{ steps.bootstrap.outputs.ecr_repository_uri }}:staging-latest"
          docker push "$IMAGE_URI"
          docker push "${{ steps.bootstrap.outputs.ecr_repository_uri }}:staging-latest"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      # Applied *before* the new image is deployed, so the schema is never behind
      # the code that expects it -- same position and same known window as
      # deploy-prod.yml (see the long comment there; the reasoning is not repeated
      # here so it cannot drift from the one place it is argued). Both guards are
      # the same two known-wrong shapes: transaction pooler (6543) and the
      # IPv6-only direct host.
      - name: Apply EF Core migrations
        env:
          ConnectionStrings__ClimateProject: ${{ secrets.MIGRATION_DATABASE_CONNECTION_STRING }}
        run: |
          set -euo pipefail

          # Guard 1: reject transaction mode (wrong semantics for EF migrations).
          if printf '%s' "$ConnectionStrings__ClimateProject" | grep -qE '(^|[^0-9])6543([^0-9]|$)'; then
            echo "::error::MIGRATION_DATABASE_CONNECTION_STRING (staging environment) points at port 6543 (the Supabase transaction-mode pooler). EF Core migrations need session mode: the same host on port 5432, username postgres.<project-ref>." >&2
            exit 1
          fi

          # Guard 2: reject the IPv6-only direct host (unroutable from Actions).
          if printf '%s' "$ConnectionStrings__ClimateProject" | grep -qE 'db\.[a-z0-9-]+\.supabase\.co'; then
            echo "::error::MIGRATION_DATABASE_CONNECTION_STRING (staging environment) points at db.<project-ref>.supabase.co (the Supabase 'direct connection'). That host is IPv6-only and GitHub Actions runners are IPv4-only, so it can never be reached from this workflow. Use the session pooler: same host as the runtime string, port 5432 (not 6543), username postgres.<project-ref>." >&2
            exit 1
          fi

          dotnet tool restore
          dotnet dotnet-ef database update \
            --project src/ClimateProject.Infrastructure \
            --startup-project src/ClimateProject.Api \
            --configuration Release

      # Every parameter passed explicitly, same rule and same reason as
      # deploy-prod.yml: `aws cloudformation deploy` reuses a parameter's PREVIOUS
      # STACK VALUE when omitted, so explicit passing is what keeps the deployed
      # configuration a function of this repository. EnvironmentName and
      # AspNetCoreEnvironment are this workflow's identity: staging/Staging.
      - name: Deploy App Runner service stack
        run: |
          set -euo pipefail
          aws cloudformation deploy \
            --stack-name "$SERVICE_STACK_NAME" \
            --template-file infra/aws/climate-project-api-prod-service.yml \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              ServiceName="$SERVICE_NAME" \
              EnvironmentName=staging \
              AspNetCoreEnvironment=Staging \
              ImageIdentifier="${{ steps.image.outputs.image_uri }}" \
              EcrAccessRoleArn="${{ steps.bootstrap.outputs.ecr_access_role_arn }}" \
              HealthCheckPath="$HEALTH_CHECK_PATH" \
              Cpu="$SERVICE_CPU" \
              Memory="$SERVICE_MEMORY" \
              CorsAllowedOrigin="${{ vars.CORS_ALLOWED_ORIGIN }}" \
              CorsAllowedWildcardOrigin="${{ vars.CORS_ALLOWED_WILDCARD_ORIGIN }}" \
              CorsAdditionalAllowedOrigin="${{ vars.CORS_ADDITIONAL_ALLOWED_ORIGIN }}" \
              CorsAdditionalAllowedWildcardOrigin="${{ vars.CORS_ADDITIONAL_ALLOWED_WILDCARD_ORIGIN }}" \
              TrackingJwtSecretArn="${{ vars.TRACKING_JWT_SECRET_ARN }}" \
              DatabaseConnectionStringSecretArn="${{ vars.DATABASE_CONNECTION_STRING_SECRET_ARN }}" \
              InternalApiKeySecretArn="${{ vars.INTERNAL_API_KEY_SECRET_ARN }}"

      - name: Read App Runner URL
        id: service
        run: |
          set -euo pipefail
          SERVICE_URL="$(aws cloudformation describe-stacks \
            --stack-name "$SERVICE_STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='ServiceUrl'].OutputValue | [0]" \
            --output text)"
          if [ -z "$SERVICE_URL" ] || [ "$SERVICE_URL" = "None" ]; then
            echo "Missing ServiceUrl output from $SERVICE_STACK_NAME" >&2
            exit 1
          fi
          echo "base_url=https://$SERVICE_URL" >> "$GITHUB_OUTPUT"

      # VERBATIM copy of deploy-prod.yml's canary -- run block and env, byte for
      # byte -- and scripts/verify-prod-deploy-invariants.py fails CI if the two
      # drift apart. The full reasoning for every constant (20 consecutive, the
      # reset-on-failure, the wall-clock deadline, the 15s probe timeout) lives on
      # the prod copy and in infra/aws/README.md (#220, #300).
      - name: Readiness canary
        env:
          # 20 from infra/aws/README.md's acceptance criterion for #220. Against the
          # alternating-50% signature, 20 consecutive is a 1-in-a-million pass.
          REQUIRED_CONSECUTIVE: 20
          PROBE_INTERVAL_SECONDS: 5
          # A wall clock, not an attempt count: because a failure resets the run, an
          # attempt budget bounds attempts but not time. 20 probes at 5s spacing needs
          # ~105s, so 300s absorbs a couple of resets and still fails the job in five
          # minutes rather than grinding toward the six-hour ceiling.
          DEADLINE_SECONDS: 300
          # Above the 9.4s cold-start probe measured post-deploy in #220 (EF model
          # build plus first pooled connection), below the 30s hang that was #220's
          # signature. A probe slower than this is a failure for canary purposes --
          # and since a failure only resets the run, a slow warm-up costs time, not
          # the deploy.
          PROBE_TIMEOUT_SECONDS: 15
        run: |
          set -euo pipefail
          URL="${{ steps.service.outputs.base_url }}/ready"
          deadline=$(( $(date +%s) + DEADLINE_SECONDS ))
          consecutive=0
          best=0
          attempt=0

          while [ "$(date +%s)" -lt "$deadline" ]; do
            attempt=$(( attempt + 1 ))
            status=$(curl -s -o /tmp/ready_body -w "%{http_code}" \
              --max-time "$PROBE_TIMEOUT_SECONDS" "$URL" || echo "000")

            if [ "$status" = "200" ]; then
              consecutive=$(( consecutive + 1 ))
              [ "$consecutive" -gt "$best" ] && best=$consecutive
              echo "probe $attempt: 200 ($consecutive/$REQUIRED_CONSECUTIVE consecutive)"
              if [ "$consecutive" -ge "$REQUIRED_CONSECUTIVE" ]; then
                echo "Readiness canary passed: $REQUIRED_CONSECUTIVE consecutive 200s in $attempt probes."
                cat /tmp/ready_body
                exit 0
              fi
            else
              echo "probe $attempt: status $status -- run of $consecutive reset to 0"
              [ -s /tmp/ready_body ] && cat /tmp/ready_body
              consecutive=0
            fi

            sleep "$PROBE_INTERVAL_SECONDS"
          done

          echo "::error::Readiness canary failed: needed $REQUIRED_CONSECUTIVE consecutive 200s from $URL within ${DEADLINE_SECONDS}s, and the longest run in $attempt probes was $best. A run that keeps resetting is the #220 signature -- an intermittently-failing database connection, not a cold start." >&2
          exit 1

      # VERBATIM copy of deploy-prod.yml's assertion, same guard against "pushed an
      # image but the rollout never took" (#158).
      - name: Verify deployed commit matches this run
        run: |
          set -euo pipefail
          DEPLOYED_COMMIT="$(scripts/read-deployed-commit.sh "${{ steps.service.outputs.base_url }}")"
          if [ "$DEPLOYED_COMMIT" != "$GITHUB_SHA" ]; then
            echo "::error::Live service reports commit '$DEPLOYED_COMMIT' but this run deployed '$GITHUB_SHA'. The rollout did not take effect." >&2
            exit 1
          fi
          echo "Live service is running the expected commit: $GITHUB_SHA"
