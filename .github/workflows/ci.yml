name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # The .NET integration suite is the longest gate in this repository -- ~18 min on a
    # healthy runner, of which ~13 is Testcontainers Postgres. Without a ceiling, a runner
    # that stalls mid-suite burns the default SIX HOURS and then reports a bare "failure"
    # with no test summary in the log, which is exactly how 2026-08-27 was spent: the run
    # died mid-SaveChanges, said nothing, and looked environmental when it was a real
    # failing test. 35 minutes is roughly double the healthy time -- long enough that a
    # slow runner still finishes, short enough that a hang is a fast, legible verdict.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ClimateProject.slnx

      - name: Build
        run: dotnet build ClimateProject.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test ClimateProject.slnx --no-build --configuration Release --verbosity normal

  # `services/tracking-api` is a SEPARATE SOLUTION, so `dotnet test ClimateProject.slnx`
  # above never touched it: 163 tests across ClimateTracking.UnitTests and
  # ClimateTracking.IntegrationTests ran nowhere at all. The only automation that built
  # this code was deploy-tracking-prod.yml, which means a red suite would have been
  # discovered *inside a production deploy* rather than on the pull request that broke
  # it. That is not hypothetical here -- it is exactly how the tracking Docker build
  # (NETSDK1152) stayed broken on main for weeks while CI reported green, because only a
  # deploy job ever built that image.
  #
  # Added after running the suite green once locally, which is the precondition
  # docs/runbooks/tracking-service-provisioning.md §2 sets before wiring this job:
  # 95 unit + 68 integration, 0 failures, on 2026-08-31.
  tracking-build-and-test:
    runs-on: ubuntu-latest
    # The suite is ~35s locally (2s unit, 30s integration). The ceiling is generous
    # against that rather than tight, because the dominant cost on a cold runner is
    # Testcontainers pulling postgres:16-alpine, not the tests -- and the reason for
    # any ceiling at all is the one in build-and-test above: a stalled runner must
    # produce a fast verdict instead of burning the default six hours and reporting
    # a bare "failure" with no summary.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # services/tracking-api/global.json, not the root one. They pin the same SDK
      # today (10.0.100, rollForward latestFeature); using the solution's own is what
      # keeps this job correct if exactly one of them moves.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: services/tracking-api/global.json

      - name: Restore
        run: dotnet restore services/tracking-api/ClimateTracking.slnx

      - name: Build
        run: dotnet build services/tracking-api/ClimateTracking.slnx --no-restore --configuration Release

      # ClimateTracking.IntegrationTests uses Testcontainers (PostgresFixture spins
      # postgres:16-alpine), so this needs the runner's Docker daemon. The
      # build-and-test job above already relies on the same thing, so this adds no
      # new requirement to the runner.
      - name: Test
        run: dotnet test services/tracking-api/ClimateTracking.slnx --no-build --configuration Release --verbosity normal

  web-build-and-test:
    runs-on: ubuntu-latest
    strategy:
      # Report every version's result: knowing a failure is 22-only vs everywhere
      # is the whole point of running the matrix.
      fail-fast: false
      matrix:
        # 22 is the floor declared in web/package.json engines, 24 is .nvmrc, 25 is
        # what developers currently run locally. All three are tested because this
        # job's guards are Node-version sensitive and drift here has hidden real
        # defects twice: #172 (Node 25 enables Web Storage by default, shadowing
        # happy-dom's localStorage) and #68 (fs.globSync is Node >=22, so on the
        # previously pinned Node 20 both repo-wide guard tests threw and the token
        # and hardcoded-string rules never actually ran in CI).
        node-version: ['22', '24', '25']
    name: web-build-and-test (node ${{ matrix.node-version }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Build
        working-directory: web
        run: npm run build

      - name: Test
        working-directory: web
        run: npm test

  web-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      # `npm run lint` is `oxlint --max-warnings 10`, pinning the documented
      # baseline (9 react-hooks/exhaustive-deps + 1 fast-refresh). The threshold
      # lives in package.json rather than here so a local run and a CI run gate
      # identically — a guard that only exists on one entrypoint is not a guard.
      - name: Lint
        working-directory: web
        run: npm run lint

  # The deploy path is the one path CI cannot validate by running it: `deploy-prod.yml`
  # is workflow_dispatch-only, so no pull request ever exercises it, and the
  # CloudFormation templates would otherwise only be "validated" by attempting a real
  # deploy.
  #
  # CORRECTED 2026-09-01: this comment used to open "`deploy-prod.yml` has never had a
  # successful run". That was true when written and is now badly false -- the workflow
  # has 15 successful runs, the most recent of which put main's nine-PR merge on
  # production. The reason these jobs exist is unchanged (a dispatch-only workflow is
  # never exercised by a PR), but the old wording made a well-trodden deploy path read
  # as unproven, which is exactly the kind of stale scare that changes a decision.
  #
  # Both jobs below are static and credential-free, which is the point:
  # `aws cloudformation validate-template` needs AWS credentials and therefore
  # cannot run on a pull request, whereas cfn-lint parses the template locally and
  # additionally checks resource properties against its own AWS spec.
  deploy-path-lint:
    name: deploy-path-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Pinned: cfn-lint ships new rules in minor releases, and an unpinned install
      # means a green PR can turn red on main with no repo change. Bump deliberately.
      - name: Install cfn-lint
        run: pip install cfn-lint==1.53.3

      - name: Lint CloudFormation templates
        run: cfn-lint infra/aws/*.yml

      # cfn-lint checks the trust policy is well-formed, not that it is correct.
      # The four `sub` claims the deploy role needs are a fact about the live
      # account, and dropping the two ID-qualified ones breaks every deploy while
      # leaving a template cfn-lint is perfectly happy with — so that specific
      # regression gets its own check. PyYAML comes in with cfn-lint above.
      - name: Verify OIDC trust policy matches live IAM
        run: python scripts/verify-oidc-trust-subs.py

      # Same reasoning, applied to the service template and the deploy workflow
      # together: that the health check probes the database rather than a literal
      # (#221), that the readiness canary counts CONSECUTIVE successes (#300), and
      # that the optional second CORS origin is droppable rather than empty (#160).
      # All three are invisible to cfn-lint and actionlint, and reverting any of them
      # is a plausible-looking one-line edit. The canary part executes the shipped
      # loop against a local /ready that alternates 200 and 503, which is why this
      # step takes ~15s rather than being instant.
      - name: Verify production deploy invariants
        run: python scripts/verify-prod-deploy-invariants.py

  workflow-lint:
    name: workflow-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # actionlint type-checks ${{ }} expressions, validates action inputs against
      # each action's real schema, and runs shellcheck over every `run:` block. The
      # deploy workflow is almost entirely shell, so that last part is most of the
      # value here.
      - name: Install actionlint
        run: |
          set -euo pipefail
          VERSION=1.7.12
          curl -sSfL -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          sudo install -m 0755 /tmp/actionlint /usr/local/bin/actionlint
          actionlint --version

      - name: Lint GitHub Actions workflows
        run: actionlint

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `scripts/verify-secret-scanning.sh` scans committed history, not just
          # the working tree, so it needs the whole history rather than a shallow
          # clone. A secret removed from HEAD but still reachable in an older blob
          # is exactly the case worth catching.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION=8.30.1
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # Asserts both directions: that a planted credential is still detected, and
      # that the repository is clean. A scanner reporting "no leaks found" because
      # it is misconfigured is indistinguishable from a genuinely clean repo, so
      # the detection half is what makes the clean half mean anything.
      - name: Verify secret scanning
        run: ./scripts/verify-secret-scanning.sh
