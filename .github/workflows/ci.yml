name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ClimateProject.slnx

      - name: Build
        run: dotnet build ClimateProject.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test ClimateProject.slnx --no-build --configuration Release --verbosity normal

  web-build-and-test:
    runs-on: ubuntu-latest
    strategy:
      # Report every version's result: knowing a failure is 22-only vs everywhere
      # is the whole point of running the matrix.
      fail-fast: false
      matrix:
        # 22 is the floor declared in web/package.json engines, 24 is .nvmrc, 25 is
        # what developers currently run locally. All three are tested because this
        # job's guards are Node-version sensitive and drift here has hidden real
        # defects twice: #172 (Node 25 enables Web Storage by default, shadowing
        # happy-dom's localStorage) and #68 (fs.globSync is Node >=22, so on the
        # previously pinned Node 20 both repo-wide guard tests threw and the token
        # and hardcoded-string rules never actually ran in CI).
        node-version: ['22', '24', '25']
    name: web-build-and-test (node ${{ matrix.node-version }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Build
        working-directory: web
        run: npm run build

      - name: Test
        working-directory: web
        run: npm test

  web-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      # `npm run lint` is `oxlint --max-warnings 10`, pinning the documented
      # baseline (9 react-hooks/exhaustive-deps + 1 fast-refresh). The threshold
      # lives in package.json rather than here so a local run and a CI run gate
      # identically — a guard that only exists on one entrypoint is not a guard.
      - name: Lint
        working-directory: web
        run: npm run lint

  # The deploy path was the one path CI never validated. `deploy-prod.yml` has never
  # had a successful run and is workflow_dispatch-only, so nothing exercised it, and
  # the CloudFormation templates were only ever "validated" by attempting a real
  # deploy. Both jobs below are static and credential-free, which is the point:
  # `aws cloudformation validate-template` needs AWS credentials and therefore
  # cannot run on a pull request, whereas cfn-lint parses the template locally and
  # additionally checks resource properties against its own AWS spec.
  deploy-path-lint:
    name: deploy-path-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Pinned: cfn-lint ships new rules in minor releases, and an unpinned install
      # means a green PR can turn red on main with no repo change. Bump deliberately.
      - name: Install cfn-lint
        run: pip install cfn-lint==1.53.3

      - name: Lint CloudFormation templates
        run: cfn-lint infra/aws/*.yml

      # cfn-lint checks the trust policy is well-formed, not that it is correct.
      # The four `sub` claims the deploy role needs are a fact about the live
      # account, and dropping the two ID-qualified ones breaks every deploy while
      # leaving a template cfn-lint is perfectly happy with — so that specific
      # regression gets its own check. PyYAML comes in with cfn-lint above.
      - name: Verify OIDC trust policy matches live IAM
        run: python scripts/verify-oidc-trust-subs.py

      # Same reasoning, applied to the service template and the deploy workflow
      # together: that the health check probes the database rather than a literal
      # (#221), that the readiness canary counts CONSECUTIVE successes (#300), and
      # that the optional second CORS origin is droppable rather than empty (#160).
      # All three are invisible to cfn-lint and actionlint, and reverting any of them
      # is a plausible-looking one-line edit. The canary part executes the shipped
      # loop against a local /ready that alternates 200 and 503, which is why this
      # step takes ~15s rather than being instant.
      - name: Verify production deploy invariants
        run: python scripts/verify-prod-deploy-invariants.py

  workflow-lint:
    name: workflow-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # actionlint type-checks ${{ }} expressions, validates action inputs against
      # each action's real schema, and runs shellcheck over every `run:` block. The
      # deploy workflow is almost entirely shell, so that last part is most of the
      # value here.
      - name: Install actionlint
        run: |
          set -euo pipefail
          VERSION=1.7.12
          curl -sSfL -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          sudo install -m 0755 /tmp/actionlint /usr/local/bin/actionlint
          actionlint --version

      - name: Lint GitHub Actions workflows
        run: actionlint

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `scripts/verify-secret-scanning.sh` scans committed history, not just
          # the working tree, so it needs the whole history rather than a shallow
          # clone. A secret removed from HEAD but still reachable in an older blob
          # is exactly the case worth catching.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION=8.30.1
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # Asserts both directions: that a planted credential is still detected, and
      # that the repository is clean. A scanner reporting "no leaks found" because
      # it is misconfigured is indistinguishable from a genuinely clean repo, so
      # the detection half is what makes the clean half mean anything.
      - name: Verify secret scanning
        run: ./scripts/verify-secret-scanning.sh
