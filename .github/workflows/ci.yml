name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ClimateProject.slnx

      - name: Build
        run: dotnet build ClimateProject.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test ClimateProject.slnx --no-build --configuration Release --verbosity normal
