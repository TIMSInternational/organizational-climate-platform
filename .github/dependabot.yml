# Weekly dependency updates (added 2026-11-15, alongside the `dependency-audit` CI job).
# Grouped so a week's minor and patch bumps arrive as one PR per ecosystem, and capped so the
# queue cannot pile up. Every PR still has to pass the full CI, including the .NET suite.
version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      timezone: America/Costa_Rica
    open-pull-requests-limit: 3
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: nuget
    directories: [/, /services/tracking-api]
    schedule:
      interval: weekly
      day: monday
      timezone: America/Costa_Rica
    open-pull-requests-limit: 3
    groups:
      dotnet-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
