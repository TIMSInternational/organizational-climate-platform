# Weekly dependency updates (added 2026-11-15, alongside the `dependency-audit` CI job).
# Grouped so a week's minor and patch bumps arrive as one PR per ecosystem, and capped so the
# queue cannot pile up. Every PR still has to pass the full CI, including the .NET suite.
version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      timezone: America/Costa_Rica
    open-pull-requests-limit: 3
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Pinned at 1.76.0 on 2026-11-18. oxlint 1.93 turns on the React Compiler rules and
      # reports 176 warnings against the 10-warning ceiling (`npm run lint`), 142 of them
      # react(set-state-in-effect) across the respondent form and most screens. Adopting those
      # rules is a refactor of its own, not a dependency bump; drop this entry when it lands.
      - dependency-name: oxlint

  - package-ecosystem: nuget
    directories: [/, /services/tracking-api]
    schedule:
      interval: weekly
      day: monday
      timezone: America/Costa_Rica
    open-pull-requests-limit: 3
    groups:
      dotnet-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # These packages ship with the .NET runtime and move to a new major only with it. The app
      # targets .NET 10 (LTS); 11.x versions (#691, #692) belong to a deliberate runtime upgrade,
      # not to a weekly bump. Minor and patch updates still arrive in the group above.
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Npgsql.EntityFrameworkCore.PostgreSQL"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.Security.Cryptography.Pkcs"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
